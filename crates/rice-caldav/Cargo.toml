[package]
name = "rice-caldav"
description = "CalDAV client of the rice backend: discovery, sync, cache, events and tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rice-core.workspace = true
rice-services.workspace = true
chrono.workspace = true
chrono-tz = "0.10.4"
log.workspace = true
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "native-tls"] }
rrule = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true

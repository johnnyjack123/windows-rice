[package]
name = "rice-win"
description = "Thin Win32/WinRT wrappers for the rice backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["policy-config"]
# Switch the default audio device through the undocumented IPolicyConfig
# interface (docs/BACKEND.md §4, audio_set_device). Without it: not_supported.
policy-config = []

[dependencies]
rice-core.workspace = true
log.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "UI_ViewManagement",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Rpc",
  "Win32_System_Shutdown",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
